[project]
name = "kalimantan-bio-auto"
version = "0.1.0"
description = "Species image scraper for biodiversity data collection (Kalimantan & general flora/fauna)"
readme = "README.md"
authors = [
    { name = "Sleepy", email = "nemorzgm.05@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pillow>=10.0.0",
    "ddgs>=9.16.0",
    "rich>=13.7.0",
    "typer>=0.12.0",
    "tenacity>=8.2.0",
    "tqdm>=4.66.0",
    "lxml>=5.0.0",
]

[project.scripts]
kalimantan-bio-auto = "kalimantan_bio_auto.cli:app"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"